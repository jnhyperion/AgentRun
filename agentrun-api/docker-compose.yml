services:
  api:
    build:
      context: ../ 
      dockerfile: agentrun-api/docker/api/Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./src/api:/code/api
      - ../agentrun:/code/agentrun
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    env_file:
      - ./.env.dev 

  python_runner:
    build:
      context: ../
      dockerfile: agentrun-api/docker/code_runner/Dockerfile
    volumes:
      - code_execution_volume:/code
    command: ["tail", "-f", "/dev/null"]
volumes:
  code_execution_volume: